[project]
name = "study-weave"
version = "0.1.0"
description = "StudyWeave AI — 수업 자료로 학습 노트를 만드는 팀 도구"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.1",
    "google-genai>=1.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "numpy>=1.26.0",
    "pdfplumber>=0.11.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "reportlab>=4.2.0",
    "streamlit>=1.38.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 외부 서비스(Postgres 등)가 실제로 떠 있어야 하는 테스트. 기본 실행에서는 제외됨.",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 오류
    "F",   # pyflakes (미사용 import/변수, 정의 안 된 이름 등)
    "I",   # import 정렬
    "UP",  # 오래된 문법을 최신 문법으로
    "B",   # 흔한 버그 패턴 (bugbear)
    "SIM", # 불필요하게 복잡한 코드 단순화 제안
]
ignore = [
    "E501",  # 줄 길이는 ruff format이 처리 — 한글 주석 많아서 이중 경고 방지
]

[tool.ruff.format]
quote-style = "double"
