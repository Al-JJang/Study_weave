services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studywave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studywave
      POSTGRES_PASSWORD: studywave
      POSTGRES_DB: studywave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studywave -d studywave"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
